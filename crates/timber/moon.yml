$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
dependsOn: [seams, core, fakes, conformance]

tasks:
  # The crate's tests over the fakes and git alone, herdr_documents among
  # them, which compares the herdr plugin's documents with the binary's,
  # and the bindings reader's test of the files the flake's module renders
  # (record 0035).
  test:
    command: 'cargo test -p timber'
    inputs: ['/crates/timber/**/*', '/crates/timber-seams/**/*', '/crates/timber-core/**/*', '/crates/timber-fakes/**/*', '/crates/timber-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/plugins/herdr/tests/docs/**/*', '/nix/tests/files/**/*']
    tags: [cargo-test, check-fast]
    options: {runFromWorkspaceRoot: true}
  # The profiles' tests that run moon, sluice and ssh-keygen against
  # scratch repositories, the registry store's against a zot and a
  # reference distribution each started for the test, the Cargo
  # projection's and its served registry's proof with the shell's cargo,
  # the npm projection's pack and npm installing from a served layout
  # with the npm devenv.lock pins, and the Nix cache target's proof against
  # an atticd started for the test with the host's Nix, behind the `tools`
  # feature: the tools layer.
  tools:
    command: 'cargo test -p timber --features tools --test build_moon --test landing_sluice --test landings_end_to_end --test laptop --test moon_cache --test registry_store --test push_after_landing --test one_host --test pool_run_publish --test cargo_projection --test cargo_served --test npm_projection --test npm_served --test nix_cache'
    inputs: ['/crates/timber/**/*', '/crates/timber-seams/**/*', '/crates/timber-core/**/*', '/crates/timber-fakes/**/*', '/crates/timber-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-tools]
    options: {runFromWorkspaceRoot: true}
  # The registry store's group and the cache manifest's scenarios against
  # the ECR repository the host names in devenv.local.nix
  # (env.TIMBER_TOOLS_ECR), behind the `tools` feature; it refuses to
  # run, naming the setting, on a host that names none. It needs a
  # person's live AWS session, so it runs outside the gate under a tag of
  # its own, by hand with `moon run ':#check-ecr'` and a live session, or
  # by a job that holds an identity of its own (core.38).
  tools-ecr:
    command: 'cargo test -p timber --features tools --test registry_ecr'
    inputs: ['/crates/timber/**/*', '/crates/timber-seams/**/*', '/crates/timber-core/**/*', '/crates/timber-fakes/**/*', '/crates/timber-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '$TIMBER_TOOLS_ECR']
    tags: [check-ecr]
    options: {runFromWorkspaceRoot: true}
  # The registry store's group, the cache manifest's scenarios, and a
  # repository the push makes read with no credential, against the
  # repository of GitHub's registry the host names in devenv.local.nix
  # (env.TIMBER_TOOLS_GHCR, as ghcr.io/<owner>/<path>), reached with the
  # credential for ghcr.io the host's Docker configuration gives, behind
  # the `tools` feature; it refuses to run, naming the setting, on a host
  # that names no repository of ghcr.io. It needs a credential a person
  # signs in for, so it runs outside the gate under a tag of its own, by
  # hand with `moon run ':#check-ghcr'` (core.38).
  tools-ghcr:
    command: 'cargo test -p timber --features tools --test registry_ghcr'
    inputs: ['/crates/timber/**/*', '/crates/timber-seams/**/*', '/crates/timber-core/**/*', '/crates/timber-fakes/**/*', '/crates/timber-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '$TIMBER_TOOLS_GHCR']
    tags: [check-ghcr]
    options: {runFromWorkspaceRoot: true}
  # The key service signer's group against the KMS keys the host names in
  # devenv.local.nix (env.TIMBER_TOOLS_KMS_KEY, and
  # env.TIMBER_TOOLS_KMS_STRANGER as the stranger), behind the `tools`
  # feature; it refuses to run, naming both settings, on a host that names
  # neither. It needs a person's live AWS session, so it runs outside the
  # gate under a tag of its own, by hand with `moon run ':#check-kms'` and a
  # live session, or by a job that holds an identity of its own (core.38).
  kms:
    command: 'cargo test -p timber --features tools --test kms_account'
    inputs: ['/crates/timber/**/*', '/crates/timber-seams/**/*', '/crates/timber-core/**/*', '/crates/timber-fakes/**/*', '/crates/timber-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '$TIMBER_TOOLS_KMS_KEY', '$TIMBER_TOOLS_KMS_STRANGER']
    tags: [check-kms]
    options: {runFromWorkspaceRoot: true}
  # The clan push profile's target group, and an apply of two versions
  # and a move back, against the throwaway machine of the clan fleet the
  # host names in devenv.local.nix (env.TIMBER_TOOLS_FLEET, as
  # `<checkout>#<machine>`), with the host's clan and Nix, behind the
  # `tools` feature; it refuses to run, naming the setting, on a host that
  # names none. It reaches the machine with the host's own key file and
  # switches it, so it runs outside the gate under a tag of its own, by
  # hand with `moon run ':#check-fleet'` (core.38).
  fleet:
    command: 'cargo test -p timber --features tools --test nix_fleet_push'
    inputs: ['/crates/timber/**/*', '/crates/timber-seams/**/*', '/crates/timber-core/**/*', '/crates/timber-fakes/**/*', '/crates/timber-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '$TIMBER_TOOLS_FLEET']
    tags: [check-fleet]
    options: {runFromWorkspaceRoot: true}
  # The Dash0 target's group, and applies of three versions with a
  # dashboard made by hand beside them, against the throwaway dataset the
  # host names in devenv.local.nix (env.TIMBER_TOOLS_DASH0, as
  # `<api>#<dataset>#<token file>`), with the CLI the tree pins
  # (TIMBER_TOOLS_DASH0_CLI), behind the `tools` feature; it refuses to run,
  # naming the setting, on a host that names none. Its token is a file a
  # person makes, which writes dashboards to that dataset, so it runs
  # outside the gate under a tag of its own, by hand with
  # `moon run ':#check-dash0'` (core.38).
  dash0:
    command: 'cargo test -p timber --features tools --test dash0'
    inputs: ['/crates/timber/**/*', '/crates/timber-seams/**/*', '/crates/timber-core/**/*', '/crates/timber-fakes/**/*', '/crates/timber-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '$TIMBER_TOOLS_DASH0']
    tags: [check-dash0]
    options: {runFromWorkspaceRoot: true}
  # The GitHub release target's group, and applies of three versions, one
  # over a draft an apply left, against the throwaway repository the host
  # names in devenv.local.nix (env.TIMBER_TOOLS_GITHUB_RELEASE, as
  # `<owner>/<name>#<token file>`), with the gh the tree pins
  # (TIMBER_TOOLS_GH_CLI), behind the `tools` feature; it refuses to run,
  # naming the setting, on a host that names none. Its token is a file a
  # person makes, which writes that repository's contents, so it runs
  # outside the gate under a tag of its own, by hand with
  # `moon run ':#check-github-release'` (core.38).
  github-release:
    command: 'cargo test -p timber --features tools --test github_release'
    inputs: ['/crates/timber/**/*', '/crates/timber-seams/**/*', '/crates/timber-core/**/*', '/crates/timber-fakes/**/*', '/crates/timber-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '$TIMBER_TOOLS_GITHUB_RELEASE']
    tags: [check-github-release]
    options: {runFromWorkspaceRoot: true}
  # The Nix cache target's proof against Cachix: a closure new to the
  # throwaway public cache the host names in devenv.local.nix
  # (env.TIMBER_TOOLS_CACHIX, as `<cache>#<token file>`) pushed through the
  # profile with the cachix the tree pins (TIMBER_TOOLS_CACHIX_CLI),
  # realised in a fresh Nix store from that cache alone, and the target
  # group run there, behind the `tools` feature; it refuses to run, naming
  # the setting, on a host that names none. Its token is a file a person
  # makes, and it reaches a hosted service, so it runs outside the gate
  # under a tag of its own, by hand with `moon run ':#check-cachix'`
  # (core.38).
  cachix:
    command: 'cargo test -p timber --features tools --test cachix'
    inputs: ['/crates/timber/**/*', '/crates/timber-seams/**/*', '/crates/timber-core/**/*', '/crates/timber-fakes/**/*', '/crates/timber-conformance/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '$TIMBER_TOOLS_CACHIX']
    tags: [check-cachix]
    options: {runFromWorkspaceRoot: true}
