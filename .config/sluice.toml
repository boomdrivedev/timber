# timber's gate: sluice gates every merge into a bolt and onto main
# (kit:gate.1) on the checks moon tags, in timber's devenv shell
# (kit:gate.2). main and the bolts live on GitHub: every round fetches them
# from origin and forms on what it holds, and a landing is a leased push as
# the host's [forge] app (kit:gate.4). crew makes each bolt there with
# `sluice branch create`.
[tests]
runner = "moon"
toolchain = ["devenv", "print-dev-env"]

# The one signer whose runs the gates count: deneb, where the sessions run
# and submit, signing as sessions with its own key, as sluice's own policy
# names it. A branch whose policy takes pull requests names its signers
# (sluice record 0125, D22), so main's pull requests are taken in.
[signers.sessions]
ssh = "deneb ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHGx/Ip3yodP/Rg3DdMAjJXoYuBmMxTLpPrka3ei69M/ sluice deneb"

[branches."bolt/*"]
required = ["#check-fast", "#check-tools"]
parallel = 2
batch = false
flaky = "fail"
timeout = "20m"
remote = "origin"
trust = ["sessions"]

[branches.main]
required = ["#check-fast", "#check-tools"]
parallel = 2
batch = true
flaky = "fail"
timeout = "20m"
remote = "origin"
trust = ["sessions"]

[branches.main.pull_requests]
reviews = 0
