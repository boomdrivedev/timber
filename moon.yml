$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: a candidate is held to what the commit hooks
# hold a commit to.
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree. It reads every tracked file: one
  # that no formatter claims and no exclude names fails it (core.25). Its
  # inputs are the tree's files that git does not ignore: moon walks the
  # root project's globs on disk, not through git, so each entry of
  # .gitignore is negated here, and an entry added there is added here. A
  # key naming a file the tree does not hold, such as the .mcp.json and
  # .claude/settings.json devenv links in (ADR 0030), is one sluice's
  # check refuses (boomdrivedev/sluice's C.6, its record 0125), as
  # sluice's, boomdrive's and weir's format tasks leave the same files out.
  format:
    command: 'treefmt --ci'
    inputs:
      - '/**/*'
      - '!/target/**'
      - '!/**/.devenv/**'
      - '!/**/.devenv.flake.nix'
      - '!/**/devenv.local.nix'
      - '!/**/.pre-commit-config.yaml'
      - '!/**/.moon/cache/**'
      - '!/result'
      - '!/result/**'
      - '!/**/.DS_Store'
      - '!/site/node_modules/**'
      - '!/site/dist/**'
      - '!/site/.astro/**'
      - '!/.mcp.json'
      - '!/.claude/settings.json'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy --workspace --all-targets --all-features -- -D warnings'
    inputs: ['/crates/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # rustc, cargo, clippy and rustfmt are the build .prototools pins, and
  # openspec the release devenv.nix pins, on whichever host runs the gate
  # (core.26; ADR 0030). It reads the tools it checks from outside the
  # tree, so it never replays, and reads no Markdown file (ADR 0036).
  toolchain:
    command: 'sh check-toolchain.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # Every spec under openspec/specs passes openspec validate --strict, which
  # fails a warning as an error, by the openspec devenv.nix pins (record
  # 0037, core.77). It sends no usage statistics and asks for no newer
  # release.
  specs:
    command: 'openspec validate --specs --strict --no-interactive'
    env: {OPENSPEC_TELEMETRY: '0', OPENSPEC_NO_UPDATE_CHECK: '1'}
    inputs: ['/openspec/specs/**/*', '/openspec/config.yaml', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every open change under openspec/changes passes the same strict
  # validation, and archives cleanly: openspec archive applies its deltas,
  # alone, to a scratch copy of the specs, and each spec it writes passes
  # openspec validate --strict (check-changes.sh; record 0037, core.77). So
  # a change archive would refuse, or one that would archive into a spec
  # root:specs fails, fails its own branch's checks and not first at its
  # archive. The specs are read and rebuilt, so they are inputs too; the
  # archived changes are not.
  changes:
    command: 'sh check-changes.sh'
    inputs: ['/openspec/changes/**/*', '!/openspec/changes/archive/**/*', '/openspec/specs/**/*', '/openspec/config.yaml', '/check-changes.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # check-changes.sh does what core.77 asks of each open change: its cases,
  # each a scratch tree of its own holding the changes it names as data,
  # check its exit and its words (check-changes-cases.sh; record 0037).
  changes-cases:
    command: 'sh check-changes-cases.sh'
    inputs: ['/check-changes.sh', '/check-changes-cases.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # rustc compiles through the compile server the host's sluice settings
  # declare, in a run and in a session's shell alike, and unwrapped where
  # the host declares none (check-compile-server.sh). It reads the shell it
  # runs in and the host's settings, so it never replays.
  compile-server:
    command: 'sh check-compile-server.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # A merge made outside the shell, as a take is, passes the commit hooks
  # devenv.nix installs (check-hooks.sh). It installs the hooks the shell
  # it runs in builds, so it never replays.
  hooks:
    command: 'sh check-hooks.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # The Claude Code marketplace, which spans the plugins: it validates, and
  # every plugin it lists has a manifest. Each plugin's own checks are its
  # project's (plugins/*/moon.yml).
  marketplace:
    command: 'plugins/check-marketplace.sh'
    inputs: ['/.claude-plugin/**/*', '/plugins/*/.claude-plugin/**/*', '/plugins/check-marketplace.sh', '/plugins/claude.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Each task that builds a binary of the workspace builds it in a target
  # folder of its own, its CARGO_TARGET_DIR (check-targets.sh; core.25):
  # cargo writes `<folder>/debug/<binary>` again at each build, and a gate
  # runs its tasks at once in one checkout. It fails naming the tasks that
  # share a folder. jq is devenv's.
  targets:
    command: 'sh check-targets.sh'
    inputs: ['/.moon/workspace.yml', '/**/moon.yml', '/**/Cargo.toml', '/*.sh', '/crates/**/*.sh', '/plugins/**/*.sh', '/nix/**/*.sh', '/check-targets.sh', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # check-targets.sh's cases, each a scratch workspace of its own whose
  # tasks share a target folder or do not (check-targets-cases.sh).
  targets-cases:
    command: 'sh check-targets-cases.sh'
    inputs: ['/check-targets.sh', '/check-targets-cases.sh', '/rust-toolchain.toml', '/.prototools', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every file that carries timber's version gives the workspace's, 0.0.0
  # on main, and the writer a release's commit runs, set-version.sh, run on
  # a scratch copy, writes a release's version into each and changes
  # nothing else (check-versions.sh; record 0031; core.74). jq is devenv's.
  versions:
    command: 'sh check-versions.sh'
    inputs: ['/Cargo.toml', '/Cargo.lock', '/plugins/claude-code/.claude-plugin/plugin.json', '/plugins/herdr/herdr-plugin.toml', '/set-version.sh', '/check-versions.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # A release's tag names the release commit release-commit.sh makes, one
  # id wherever it runs, proved in scratch repositories; and a build takes
  # timber's version from its tree alone (check-release.sh; record 0031;
  # core.74). git and jq are devenv's, and it needs no credential.
  release:
    command: 'sh check-release.sh'
    inputs: ['/set-version.sh', '/release-commit.sh', '/check-release.sh', '/Cargo.toml', '/Cargo.lock', '/plugins/claude-code/.claude-plugin/plugin.json', '/plugins/herdr/herdr-plugin.toml', '/.github/workflows/ci.yml', '/flake.nix', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The next version, reckoned by next-version.sh on scratch repositories
  # laid out as the releases lay out timber's: a second push reckoned once
  # the first's tag is pushed is the next version, and a run whose commit
  # a later release already holds releases nothing (check-next-version.sh).
  # git-cliff is devenv's (core.26), and it needs no credential (core.38).
  next-version:
    command: 'sh check-next-version.sh'
    inputs: ['/next-version.sh', '/check-next-version.sh', '/cliff.toml', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
